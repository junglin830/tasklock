[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tasklock"
version = "1.0.1"
description = "Collision-free task IDs for a shared tasks.json used by several AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "junglin830"}]
keywords = ["ai-agents","claude-code","codex","file-lock"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/junglin830/tasklock"

[project.scripts]
tasklock = "tasklock:main"

[tool.setuptools]
py-modules = ["tasklock"]
